name: Update Football Matches

on:
  schedule:
    # Default schedule.
    # Final frequency should remain controlled by config/schedule.json.
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-matches-pipeline
  cancel-in-progress: false

jobs:

  update-matches:

    name: Fetch → Normalize → Deduplicate → Validate → Build

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      # ---------------------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------------------
      # 2. Setup Python
      # ---------------------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ---------------------------------------------------------------------
      # 3. Install validation dependencies
      # ---------------------------------------------------------------------

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install jsonschema
          fi

      # ---------------------------------------------------------------------
      # 4. Verify official pipeline configuration
      # ---------------------------------------------------------------------

      - name: Verify pipeline configuration
        shell: bash
        run: |
          set -euo pipefail

          test -f source.json
          test -f config/pipeline.json
          test -f config/validation.json
          test -f config/schedule.json
          test -f schemas/matches.schema.json

          test -f scripts/fetch.py
          test -f scripts/normalize.py
          test -f scripts/deduplicate.py
          test -f scripts/validate.py
          test -f scripts/build_matches.py

          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path("source.json"),
              Path("config/pipeline.json"),
              Path("config/validation.json"),
              Path("config/schedule.json"),
              Path("schemas/matches.schema.json"),
          ]

          for path in files:
              with path.open("r", encoding="utf-8") as f:
                  json.load(f)

              print(f"[CONFIG] VALID JSON: {path}")
          PY

      # ---------------------------------------------------------------------
      # 5. Generate pipeline run ID
      # ---------------------------------------------------------------------

      - name: Generate pipeline run ID
        shell: bash
        run: |
          set -euo pipefail

          RUN_ID="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "PIPELINE_RUN_ID=${RUN_ID}" >> "$GITHUB_ENV"

          echo "Pipeline Run ID: ${RUN_ID}"

      # ---------------------------------------------------------------------
      # 6. Prepare runtime directories
      # ---------------------------------------------------------------------

      - name: Prepare pipeline directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p raw
          mkdir -p normalized
          mkdir -p validation
          mkdir -p diagnostics
          mkdir -p data

      # ---------------------------------------------------------------------
      # 7. Fetch
      # ---------------------------------------------------------------------

      - name: Fetch source data
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================================================"
          echo "Football Match Data Pipeline - FETCH"
          echo "========================================================================"

          python scripts/fetch.py

      # ---------------------------------------------------------------------
      # 8. Normalize
      # ---------------------------------------------------------------------

      - name: Normalize source data
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================================================"
          echo "Football Match Data Pipeline - NORMALIZE"
          echo "========================================================================"

          python scripts/normalize.py

      # ---------------------------------------------------------------------
      # 9. Deduplicate
      # ---------------------------------------------------------------------

      - name: Deduplicate matches
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================================================"
          echo "Football Match Data Pipeline - DEDUPLICATE"
          echo "========================================================================"

          python scripts/deduplicate.py

      # ---------------------------------------------------------------------
      # 10. Validate
      #
      # IMPORTANT:
      #
      # We intentionally do NOT use:
      #
      #     set -e
      #
      # before validate.py.
      #
      # This allows the script to finish and generate its report even when
      # validation fails.
      #
      # The original exit code is captured and returned at the end.
      # ---------------------------------------------------------------------

      - name: Validate dataset
        shell: bash
        run: |
          set +e

          echo "========================================================================"
          echo "Football Match Data Pipeline - VALIDATE"
          echo "========================================================================"

          python scripts/validate.py

          STATUS=$?

          echo
          echo "------------------------------------------------------------------------"
          echo "VALIDATION REPORT"
          echo "------------------------------------------------------------------------"

          if [ -f validation/validation-report.json ]; then

            echo "[VALIDATION] Report found:"
            echo "validation/validation-report.json"
            echo

            cat validation/validation-report.json

          else

            echo "[VALIDATION][WARNING] "
            echo "validation/validation-report.json was not generated."

          fi

          echo
          echo "------------------------------------------------------------------------"
          echo "VALIDATION EXIT CODE: ${STATUS}"
          echo "------------------------------------------------------------------------"

          exit "${STATUS}"

      # ---------------------------------------------------------------------
      # 11. Upload validation report
      #
      # ALWAYS runs, including when validation fails.
      #
      # This makes the report available from:
      #
      # GitHub Actions → Run → Artifacts → validation-report
      # ---------------------------------------------------------------------

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: validation/validation-report.json
          if-no-files-found: warn
          retention-days: 14

      # ---------------------------------------------------------------------
      # 12. Upload pipeline diagnostics
      #
      # ALWAYS runs so diagnostic information survives a failed pipeline.
      # ---------------------------------------------------------------------

      - name: Upload pipeline diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-diagnostics
          path: |
            diagnostics/**
            validation/**
          if-no-files-found: warn
          retention-days: 14

      # ---------------------------------------------------------------------
      # 13. Build official matches.json
      #
      # This executes only if validation succeeded.
      # ---------------------------------------------------------------------

      - name: Build official matches.json
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================================================"
          echo "Football Match Data Pipeline - BUILD"
          echo "========================================================================"

          python scripts/build_matches.py

      # ---------------------------------------------------------------------
      # 14. Verify final artifact
      # ---------------------------------------------------------------------

      - name: Verify published matches.json
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          test -f data/matches.json

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/matches.json")

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          if data.get("schemaVersion") != "1.0":
              raise SystemExit(
                  "Invalid matches.json schemaVersion"
              )

          pipeline = data.get("pipeline", {})

          if pipeline.get("validationStatus") != "PASS":
              raise SystemExit(
                  "matches.json was not produced from a PASS validation"
              )

          if pipeline.get("publicationAllowed") is not True:
              raise SystemExit(
                  "matches.json publication was not authorized"
              )

          if not isinstance(
              data.get("matches"),
              list
          ):
              raise SystemExit(
                  "matches.json matches field is not an array"
              )

          print(
              f"Verified {len(data['matches'])} matches."
          )

          print(
              f"Dataset hash: {data.get('datasetHash')}"
          )
          PY

      # ---------------------------------------------------------------------
      # 15. Show git changes
      # ---------------------------------------------------------------------

      - name: Check repository changes
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================================================"
          echo "GIT CHANGES"
          echo "========================================================================"

          git status --short

      # ---------------------------------------------------------------------
      # 16. Commit updated data
      # ---------------------------------------------------------------------

      - name: Commit updated match data
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/matches.json

          if [ -f diagnostics/pipeline-status.json ]; then
            git add diagnostics/pipeline-status.json
          fi

          if git diff --cached --quiet; then
            echo "No dataset changes detected."
            exit 0
          fi

          git commit \
            -m "chore(data): update football matches"

      # ---------------------------------------------------------------------
      # 17. Push changes
      # ---------------------------------------------------------------------

      - name: Push updated data
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          git push
