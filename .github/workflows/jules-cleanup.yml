name: Jules - Daily Cleanup

# ─────────────────────────────────────────────────────────────────────────────
# Cleans residual data created by the autonomous Jules loop.
# Designed to be dropped into any repository that uses the Jules system.
#
# Retention rule (hard):
#   • Keep everything younger than 7 days
#   • Delete everything older than 7 days
#
# What it cleans:
#   1. Old daily branches          →  jules/YYYY-MM-DD
#   2. Temporary Jules branches    →  jules/session-*, jules/tmp-*, jules/pr-*, …
#   3. Old completed workflow runs of Jules (and this cleanup workflow itself)
#   4. GitHub Actions Artifacts older than 7 days
#   5. GitHub Actions Caches older than 7 days
#   6. Temporary files left in the repository root by Jules sessions
#   7. Stale local git objects that may accumulate (gc)
#
# NEVER touches:
#   • Source code of the Android application
#   • .jules/ state files (STATE.md, SESSION_LOG.md, QUALITY_GATE.md, …)
#   • AGENTS.md, MASTER_PROMPT.md, or any project configuration
#   • Today's Jules branch
#
# Schedule: every day at 03:00 UTC (04:00 Tunisia / CET)
# Manual trigger is also available with dry-run support.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Runs every day at 03:00 UTC → 04:00 Africa/Tunis
    - cron: "0 3 * * *"

  workflow_dispatch:
    inputs:
      keep_days:
        description: "Number of days to keep (default 7 – do not change unless needed)"
        required: false
        default: "7"
      dry_run:
        description: "Dry run only (true = show what would be deleted, false = actually delete)"
        required: false
        default: "false"
      clean_workflow_runs:
        description: "Delete old Jules workflow runs? (true/false)"
        required: false
        default: "true"
      clean_artifacts:
        description: "Delete old GitHub Actions Artifacts? (true/false)"
        required: false
        default: "true"
      clean_caches:
        description: "Delete old GitHub Actions Caches? (true/false)"
        required: false
        default: "true"

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: jules-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ──────────────────────────────────────────────────────────────
      # 1. Checkout
      # ──────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ──────────────────────────────────────────────────────────────
      # 2. Resolve parameters
      # ──────────────────────────────────────────────────────────────
      - name: Resolve cleanup parameters
        id: params
        shell: bash
        run: |
          set -euo pipefail

          KEEP_DAYS="${{ github.event.inputs.keep_days }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          CLEAN_RUNS="${{ github.event.inputs.clean_workflow_runs }}"
          CLEAN_ARTIFACTS="${{ github.event.inputs.clean_artifacts }}"
          CLEAN_CACHES="${{ github.event.inputs.clean_caches }}"

          # Defaults when triggered by schedule
          KEEP_DAYS="${KEEP_DAYS:-7}"
          DRY_RUN="${DRY_RUN:-false}"
          CLEAN_RUNS="${CLEAN_RUNS:-true}"
          CLEAN_ARTIFACTS="${CLEAN_ARTIFACTS:-true}"
          CLEAN_CACHES="${CLEAN_CACHES:-true}"

          # Safety clamps – never allow less than 1 day or more than 30 days
          if ! [[ "$KEEP_DAYS" =~ ^[0-9]+$ ]] || [[ "$KEEP_DAYS" -lt 1 ]]; then
            echo "Invalid keep_days → forcing to 7"
            KEEP_DAYS=7
          fi
          if [[ "$KEEP_DAYS" -gt 30 ]]; then
            echo "keep_days too high → clamping to 30"
            KEEP_DAYS=30
          fi

          echo "keep_days=${KEEP_DAYS}"             >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN}"                 >> "$GITHUB_OUTPUT"
          echo "clean_runs=${CLEAN_RUNS}"           >> "$GITHUB_OUTPUT"
          echo "clean_artifacts=${CLEAN_ARTIFACTS}" >> "$GITHUB_OUTPUT"
          echo "clean_caches=${CLEAN_CACHES}"       >> "$GITHUB_OUTPUT"

          echo "========================================"
          echo "Jules Cleanup Parameters"
          echo "========================================"
          echo "Keep days            : ${KEEP_DAYS}"
          echo "Dry run              : ${DRY_RUN}"
          echo "Clean workflow runs  : ${CLEAN_RUNS}"
          echo "Clean artifacts      : ${CLEAN_ARTIFACTS}"
          echo "Clean caches         : ${CLEAN_CACHES}"
          echo "Repository           : ${{ github.repository }}"
          echo "Triggered by         : ${{ github.event_name }}"
          echo "========================================"

      # ──────────────────────────────────────────────────────────────
      # 3. Delete old Jules daily branches (jules/YYYY-MM-DD)
      # ──────────────────────────────────────────────────────────────
      - name: Cleanup old Jules daily branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_DAYS: ${{ steps.params.outputs.keep_days }}
          DRY_RUN: ${{ steps.params.outputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail

          echo ">>> [1/7] Cleaning old Jules daily branches (keeping last ${KEEP_DAYS} days)"

          TODAY=$(TZ=Africa/Tunis date +%Y-%m-%d)
          CUTOFF=$(TZ=Africa/Tunis date -d "${TODAY} - ${KEEP_DAYS} days" +%Y-%m-%d)

          echo "Today  : ${TODAY}"
          echo "Cutoff : ${CUTOFF}  (anything older will be deleted)"
          echo

          mapfile -t BRANCHES < <(git ls-remote --heads origin 'jules/*' | awk '{print $2}' | sed 's|refs/heads/||' || true)

          if [[ ${#BRANCHES[@]} -eq 0 ]]; then
            echo "No Jules branches found."
            exit 0
          fi

          DELETED=0
          KEPT=0
          SKIPPED=0

          for BRANCH in "${BRANCHES[@]}"; do
            # Only process strict daily branches: jules/YYYY-MM-DD
            if [[ ! "$BRANCH" =~ ^jules/[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "SKIP (non-daily pattern): ${BRANCH}"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            BRANCH_DATE="${BRANCH#jules/}"

            # Never delete today's branch
            if [[ "$BRANCH_DATE" == "$TODAY" ]]; then
              echo "KEEP (today): ${BRANCH}"
              KEPT=$((KEPT + 1))
              continue
            fi

            # Keep if newer than or equal to cutoff
            if [[ "$BRANCH_DATE" > "$CUTOFF" ]] || [[ "$BRANCH_DATE" == "$CUTOFF" ]]; then
              echo "KEEP (within retention): ${BRANCH}"
              KEPT=$((KEPT + 1))
              continue
            fi

            # Delete old branch
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "DRY-RUN would delete: ${BRANCH}"
            else
              echo "DELETE: ${BRANCH}"
              git push origin --delete "${BRANCH}" || {
                echo "WARNING: failed to delete ${BRANCH}"
              }
            fi
            DELETED=$((DELETED + 1))
          done

          echo
          echo "Branch cleanup summary → Deleted: ${DELETED} | Kept: ${KEPT} | Skipped: ${SKIPPED}"

      # ──────────────────────────────────────────────────────────────
      # 4. Delete leftover temporary Jules branches
      # ──────────────────────────────────────────────────────────────
      - name: Cleanup temporary Jules branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ steps.params.outputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail

          echo ">>> [2/7] Cleaning temporary Jules branches"

          mapfile -t TEMP_BRANCHES < <(
            git ls-remote --heads origin 'jules/*' \
              | awk '{print $2}' \
              | sed 's|refs/heads/||' \
              | grep -E '^jules/(session-|tmp-|pr-|work-|auto-|run-|feature-|fix-)' \
              || true
          )

          if [[ ${#TEMP_BRANCHES[@]} -eq 0 ]]; then
            echo "No temporary Jules branches found."
            exit 0
          fi

          COUNT=0
          for BRANCH in "${TEMP_BRANCHES[@]}"; do
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "DRY-RUN would delete temp branch: ${BRANCH}"
            else
              echo "DELETE temp branch: ${BRANCH}"
              git push origin --delete "${BRANCH}" || true
            fi
            COUNT=$((COUNT + 1))
          done
          echo "Temporary branches processed: ${COUNT}"

      # ──────────────────────────────────────────────────────────────
      # 5. Clean old workflow runs (Jules autonomous loop + this cleanup)
      # ──────────────────────────────────────────────────────────────
      - name: Cleanup old Jules workflow runs
        if: steps.params.outputs.clean_runs == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_DAYS: ${{ steps.params.outputs.keep_days }}
          DRY_RUN: ${{ steps.params.outputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail

          echo ">>> [3/7] Cleaning old workflow runs (keeping last ${KEEP_DAYS} days)"

          CUTOFF_DATE=$(date -u -d "${KEEP_DAYS} days ago" +%Y-%m-%dT%H:%M:%SZ)
          echo "Cutoff date for runs: ${CUTOFF_DATE}"

          # Names of workflows we are allowed to clean
          TARGET_WORKFLOWS=(
            "Jules - Autonomous AAA Android Development Loop"
            "Jules - Daily Cleanup"
          )

          TOTAL_DELETED=0
          PAGE=1

          while [[ $PAGE -le 10 ]]; do
            RESPONSE=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/actions/runs?per_page=100&page=${PAGE}&status=completed" \
              --jq '.workflow_runs[] | select(.created_at < "'"${CUTOFF_DATE}"'") | {id: .id, name: .name}' \
              2>/dev/null || echo "")

            if [[ -z "$RESPONSE" ]]; then
              break
            fi

            while IFS= read -r LINE; do
              [[ -z "$LINE" ]] && continue

              RUN_ID=$(echo "$LINE" | jq -r '.id')
              RUN_NAME=$(echo "$LINE" | jq -r '.name')

              # Only delete runs that belong to Jules workflows
              MATCH=false
              for TARGET in "${TARGET_WORKFLOWS[@]}"; do
                if [[ "$RUN_NAME" == "$TARGET" ]]; then
                  MATCH=true
                  break
                fi
              done

              if [[ "$MATCH" != "true" ]]; then
                continue
              fi

              if [[ "$DRY_RUN" == "true" ]]; then
                echo "DRY-RUN would delete run ${RUN_ID} (${RUN_NAME})"
              else
                echo "DELETE run ${RUN_ID} (${RUN_NAME})"
                gh api \
                  --method DELETE \
                  -H "Accept: application/vnd.github+json" \
                  "/repos/${{ github.repository }}/actions/runs/${RUN_ID}" \
                  || echo "WARNING: could not delete run ${RUN_ID}"
              fi
              TOTAL_DELETED=$((TOTAL_DELETED + 1))
            done <<< "$RESPONSE"

            PAGE=$((PAGE + 1))
          done

          echo "Workflow runs cleaned: ${TOTAL_DELETED}"

      # ──────────────────────────────────────────────────────────────
      # 6. Clean old GitHub Actions Artifacts
      # ──────────────────────────────────────────────────────────────
      - name: Cleanup old GitHub Actions Artifacts
        if: steps.params.outputs.clean_artifacts == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_DAYS: ${{ steps.params.outputs.keep_days }}
          DRY_RUN: ${{ steps.params.outputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail

          echo ">>> [4/7] Cleaning old GitHub Actions Artifacts (keeping last ${KEEP_DAYS} days)"

          CUTOFF_DATE=$(date -u -d "${KEEP_DAYS} days ago" +%Y-%m-%dT%H:%M:%SZ)
          echo "Cutoff date for artifacts: ${CUTOFF_DATE}"

          TOTAL_DELETED=0
          PAGE=1

          while [[ $PAGE -le 10 ]]; do
            RESPONSE=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/actions/artifacts?per_page=100&page=${PAGE}" \
              --jq '.artifacts[] | select(.created_at < "'"${CUTOFF_DATE}"'") | {id: .id, name: .name, size: .size_in_bytes}' \
              2>/dev/null || echo "")

            if [[ -z "$RESPONSE" ]]; then
              break
            fi

            while IFS= read -r LINE; do
              [[ -z "$LINE" ]] && continue

              ART_ID=$(echo "$LINE" | jq -r '.id')
              ART_NAME=$(echo "$LINE" | jq -r '.name')
              ART_SIZE=$(echo "$LINE" | jq -r '.size')

              if [[ "$DRY_RUN" == "true" ]]; then
                echo "DRY-RUN would delete artifact ${ART_ID} (${ART_NAME}, ${ART_SIZE} bytes)"
              else
                echo "DELETE artifact ${ART_ID} (${ART_NAME}, ${ART_SIZE} bytes)"
                gh api \
                  --method DELETE \
                  -H "Accept: application/vnd.github+json" \
                  "/repos/${{ github.repository }}/actions/artifacts/${ART_ID}" \
                  || echo "WARNING: could not delete artifact ${ART_ID}"
              fi
              TOTAL_DELETED=$((TOTAL_DELETED + 1))
            done <<< "$RESPONSE"

            PAGE=$((PAGE + 1))
          done

          echo "Artifacts cleaned: ${TOTAL_DELETED}"

      # ──────────────────────────────────────────────────────────────
      # 7. Clean old GitHub Actions Caches
      # ──────────────────────────────────────────────────────────────
      - name: Cleanup old GitHub Actions Caches
        if: steps.params.outputs.clean_caches == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_DAYS: ${{ steps.params.outputs.keep_days }}
          DRY_RUN: ${{ steps.params.outputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail

          echo ">>> [5/7] Cleaning old GitHub Actions Caches (keeping last ${KEEP_DAYS} days)"

          CUTOFF_EPOCH=$(date -u -d "${KEEP_DAYS} days ago" +%s)
          echo "Cutoff epoch for caches: ${CUTOFF_EPOCH}"

          TOTAL_DELETED=0
          PAGE=1

          while [[ $PAGE -le 10 ]]; do
            # GitHub cache API returns last_accessed_at
            RESPONSE=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/actions/caches?per_page=100&page=${PAGE}" \
              --jq '.actions_caches[] | {id: .id, key: .key, last_accessed: .last_accessed_at, size: .size_in_bytes}' \
              2>/dev/null || echo "")

            if [[ -z "$RESPONSE" ]]; then
              break
            fi

            while IFS= read -r LINE; do
              [[ -z "$LINE" ]] && continue

              CACHE_ID=$(echo "$LINE" | jq -r '.id')
              CACHE_KEY=$(echo "$LINE" | jq -r '.key')
              LAST_ACCESSED=$(echo "$LINE" | jq -r '.last_accessed')
              CACHE_SIZE=$(echo "$LINE" | jq -r '.size')

              # Convert last_accessed to epoch
              LAST_EPOCH=$(date -u -d "${LAST_ACCESSED}" +%s 2>/dev/null || echo 0)

              if [[ "$LAST_EPOCH" -ge "$CUTOFF_EPOCH" ]]; then
                echo "KEEP cache ${CACHE_ID} (${CACHE_KEY}) – last accessed ${LAST_ACCESSED}"
                continue
              fi

              if [[ "$DRY_RUN" == "true" ]]; then
                echo "DRY-RUN would delete cache ${CACHE_ID} (${CACHE_KEY}, ${CACHE_SIZE} bytes, last: ${LAST_ACCESSED})"
              else
                echo "DELETE cache ${CACHE_ID} (${CACHE_KEY}, ${CACHE_SIZE} bytes, last: ${LAST_ACCESSED})"
                gh api \
                  --method DELETE \
                  -H "Accept: application/vnd.github+json" \
                  "/repos/${{ github.repository }}/actions/caches/${CACHE_ID}" \
                  || echo "WARNING: could not delete cache ${CACHE_ID}"
              fi
              TOTAL_DELETED=$((TOTAL_DELETED + 1))
            done <<< "$RESPONSE"

            PAGE=$((PAGE + 1))
          done

          echo "Caches cleaned: ${TOTAL_DELETED}"

      # ──────────────────────────────────────────────────────────────
      # 8. Remove temporary files left in the repository by Jules
      #    (never touches real application source or .jules state)
      # ──────────────────────────────────────────────────────────────
      - name: Cleanup temporary files in repository
        env:
          DRY_RUN: ${{ steps.params.outputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail

          echo ">>> [6/7] Cleaning temporary files left by Jules sessions"

          # Only files that Jules is known to create temporarily.
          # NEVER touch application source, .jules/, AGENTS.md, etc.
          TEMP_FILES=(
            "jules-prompt.txt"
            "jules-session-result.json"
            "jules-output.json"
            "jules-result.json"
            "jules-tmp.txt"
            "jules-debug.log"
          )

          TEMP_GLOBS=(
            "jules-tmp-*"
            "*.jules.tmp"
            "jules-*.log"
          )

          FOUND=0

          for FILE in "${TEMP_FILES[@]}"; do
            if [[ -f "$FILE" ]]; then
              FOUND=$((FOUND + 1))
              if [[ "$DRY_RUN" == "true" ]]; then
                echo "DRY-RUN would remove: ${FILE}"
              else
                echo "REMOVE: ${FILE}"
                rm -f "$FILE"
              fi
            fi
          done

          for PATTERN in "${TEMP_GLOBS[@]}"; do
            # shellcheck disable=SC2086
            for FILE in $PATTERN; do
              if [[ -f "$FILE" ]]; then
                FOUND=$((FOUND + 1))
                if [[ "$DRY_RUN" == "true" ]]; then
                  echo "DRY-RUN would remove: ${FILE}"
                else
                  echo "REMOVE: ${FILE}"
                  rm -f "$FILE"
                fi
              fi
            done
          done

          if [[ $FOUND -eq 0 ]]; then
            echo "No temporary files found in repository root."
          else
            echo "Temporary files processed: ${FOUND}"
          fi

          # Safety note
          echo
          echo "Protected paths (never touched):"
          echo "  • Application source code"
          echo "  • .jules/ directory (STATE.md, SESSION_LOG.md, …)"
          echo "  • AGENTS.md / MASTER_PROMPT.md"
          echo "  • .github/workflows/"

      # ──────────────────────────────────────────────────────────────
      # 9. Optional light git garbage collection (local only)
      # ──────────────────────────────────────────────────────────────
      - name: Git garbage collection (local)
        shell: bash
        run: |
          set -euo pipefail

          echo ">>> [7/7] Running light git garbage collection"

          # Only prune objects older than 7 days that are already unreachable
          git gc --auto --prune=7.days.ago || true
          echo "Git gc finished."

      # ──────────────────────────────────────────────────────────────
      # 10. Final summary
      # ──────────────────────────────────────────────────────────────
      - name: Cleanup summary
        shell: bash
        run: |
          echo
          echo "========================================"
          echo "Jules Daily Cleanup finished"
          echo "========================================"
          echo "Time             : $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Repository       : ${{ github.repository }}"
          echo "Dry run          : ${{ steps.params.outputs.dry_run }}"
          echo "Keep days        : ${{ steps.params.outputs.keep_days }}"
          echo "Cleaned:"
          echo "  • Old Jules daily branches (> ${{ steps.params.outputs.keep_days }} days)"
          echo "  • Temporary Jules branches"
          echo "  • Old workflow runs"
          echo "  • Old Artifacts"
          echo "  • Old Caches"
          echo "  • Temporary files in repo root"
          echo "Protected:"
          echo "  • Application source code"
          echo "  • .jules/ state files"
          echo "  • Project configuration files"
          echo "========================================"
          echo "Cleanup completed successfully."